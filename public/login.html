<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Đăng Nhập • Freze Domain Hub Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-glow: rgba(99, 102, 241, 0.35);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    .bg-glow-1 {
      position: fixed;
      top: -15%;
      left: -10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: -15%;
      right: -10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(99, 102, 241, 0.2);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(6, 182, 212, 0.3));
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(0, 0, 0, 0.6);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-mode-btn {
      background: transparent;
      border: none;
      color: var(--accent-cyan);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 16px;
      transition: color 0.2s;
    }

    .toggle-mode-btn:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 30px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">⚡</div>
      <h1 class="brand-title">FREZE DOMAIN HUB</h1>
      <p class="brand-subtitle" id="authSubtitle">Đăng nhập để vào hệ thống quản trị</p>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label class="form-label" for="username">Tên Đăng Nhập (Username)</label>
        <input type="text" id="username" class="form-input" placeholder="Nhập tên tài khoản" autocomplete="username" required>
      </div>

      <div class="form-group" id="fullNameGroup" style="display: none;">
        <label class="form-label" for="fullName">Họ Tên / Tên Đại Lý</label>
        <input type="text" id="fullName" class="form-input" placeholder="Đại Lý Nam">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật Khẩu</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        🚀 ĐĂNG NHẬP NGAY
      </button>

      <button type="button" class="toggle-mode-btn" id="btnToggleMode" onclick="toggleAuthMode()">
        Chưa có tài khoản? Bấm vào đây để đăng ký
      </button>
    </form>
  </div>

  <div id="toast" class="toast-box">Thông báo</div>

  <script>
    let isRegisterMode = false;

    // Check if already authenticated
    (async function checkExistingAuth() {
      const token = localStorage.getItem("freze_auth_token");
      if (token) {
        try {
          const res = await fetch("/api/auth/me", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success && data.user) {
            window.location.href = "/";
          }
        } catch {}
      }
    })();

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const subtitle = document.getElementById("authSubtitle");
      const fullNameGroup = document.getElementById("fullNameGroup");
      const btnSubmit = document.getElementById("btnSubmit");
      const btnToggle = document.getElementById("btnToggleMode");

      if (isRegisterMode) {
        subtitle.textContent = "Đăng ký tài khoản thành viên mới";
        fullNameGroup.style.display = "block";
        btnSubmit.textContent = "✨ TẠO TÀI KHOẢN MỚI";
        btnToggle.textContent = "Đã có tài khoản? Quay lại đăng nhập";
      } else {
        subtitle.textContent = "Đăng nhập để vào hệ thống quản trị";
        fullNameGroup.style.display = "none";
        btnSubmit.textContent = "🚀 ĐĂNG NHẬP NGAY";
        btnToggle.textContent = "Chưa có tài khoản? Bấm vào đây để đăng ký";
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const fullName = document.getElementById("fullName")?.value.trim();

      if (!username || !password) {
        showToast("⚠️ Vui lòng nhập đầy đủ thông tin");
        return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.textContent = "⏳ Đang xác thực...";

      const endpoint = isRegisterMode ? "/api/auth/register" : "/api/auth/login";
      const payload = isRegisterMode ? { username, password, fullName: fullName || username } : { username, password };

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem("freze_auth_token", data.token);
          showToast(`🎉 Đăng nhập thành công! Đang chuyển hướng...`);
          setTimeout(() => {
            window.location.href = "/";
          }, 400);
        } else {
          showToast(`❌ ${data.error || "Xác thực thất bại"}`);
          btn.disabled = false;
          btn.textContent = isRegisterMode ? "✨ TẠO TÀI KHOẢN MỚI" : "🚀 ĐĂNG NHẬP NGAY";
        }
      } catch (err) {
        showToast(`❌ Lỗi kết nối: ${err.message}`);
        btn.disabled = false;
        btn.textContent = isRegisterMode ? "✨ TẠO TÀI KHOẢN MỚI" : "🚀 ĐĂNG NHẬP NGAY";
      }
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("show"), 3500);
    }
  </script>
</body>
</html>
